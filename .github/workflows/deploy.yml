name: Controleren en publiceren

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pagina's bouwen
        run: python3 build.py

      - name: Controleren of de gebouwde bestanden in de repository bijgewerkt zijn
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::De bestanden in de repository lopen achter op build.py."
            echo "Draai lokaal 'python3 build.py', commit de wijzigingen en push opnieuw."
            echo "Dit verschilt:"
            git status --short
            git --no-pager diff -- . ':(exclude)img' | head -60
            exit 1
          fi
          echo "De gebouwde bestanden zijn bij."

      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium

      - name: SEO-controles draaien
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # Alleen publiceren vanaf main, en alleen als alles hierboven is geslaagd.
      # Staat PUBLIEK in build.py op False, dan gaat het naar een tijdelijk voorbeeldadres
      # in plaats van naar je eigen domein.
      - name: Publiceren naar Netlify
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # via een variabele, zodat aanhalingstekens in een commit-bericht niets breken
          COMMIT_BERICHT: ${{ github.event.head_commit.message }}
        run: |
          if grep -q "^PUBLIEK = True" build.py; then
            echo "PUBLIEK staat aan: publiceren naar het echte adres."
            npx --yes netlify-cli@17 deploy --prod --dir . --message "$COMMIT_BERICHT"
          else
            echo "PUBLIEK staat uit: publiceren naar een tijdelijk voorbeeldadres."
            echo "Zet PUBLIEK op True in build.py zodra de site openbaar mag."
            npx --yes netlify-cli@17 deploy --dir . --message "$COMMIT_BERICHT"
          fi
